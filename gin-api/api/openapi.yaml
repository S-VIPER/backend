openapi: 3.0.3

info:
  title: S-VIPER API
  description: REST API for S-VIPER music service
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

tags:
  - name: Playlists
    description: Playlist operations
  - name: Tracks
    description: Track operations
  - name: Auth
    description: Authentication operations

paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Start user registration
      description: Creates a pending registration and sends a verification code to the user's email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration started and verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register/verify:
    post:
      tags:
        - Auth
      operationId: verifyRegistration
      summary: Verify user email during registration
      description: Verifies the email address using the code sent during registration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
      responses:
        '201':
          description: User registered and email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register/resend:
    post:
      tags:
        - Auth
      operationId: resendRegistrationVerification
      summary: Resend registration verification code
      description: Sends a new verification code for a pending registration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRegistrationVerificationRequest'
      responses:
        '202':
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationVerificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks:
    post:
      tags:
        - Tracks
      operationId: createTrack
      summary: Create track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackRequest'
      responses:
        '201':
          description: Track created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Tracks
      operationId: getAllTracks
      summary: Get all tracks
      security: []
      responses:
        '200':
          description: Tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'

    get:
      tags:
        - Tracks
      operationId: getTrackByID
      summary: Get track by ID
      security: []
      responses:
        '200':
          description: Track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Tracks
      operationId: updateTrack
      summary: Update track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackRequest'
      responses:
        '200':
          description: Track updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Tracks
      operationId: deleteTrack
      summary: Delete track
      responses:
        '204':
          description: Track deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists:
    post:
      tags:
        - Playlists
      operationId: createPlaylist
      summary: Create playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'

    get:
      tags:
        - Playlists
      operationId: getPlaylistByID
      summary: Get playlist by ID
      description: Returns a public playlist.
      security: []
      responses:
        '200':
          description: Playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Playlists
      operationId: updatePlaylist
      summary: Update playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: Playlist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Playlists
      operationId: deletePlaylist
      summary: Delete playlist
      responses:
        '204':
          description: Playlist deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists/{playlistId}/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: '#/components/parameters/TrackId'

    post:
      tags:
        - Playlists
      operationId: addTrackToPlaylist
      summary: Add track to playlist
      responses:
        '200':
          description: Track added to playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Playlists
      operationId: removeTrackFromPlaylist
      summary: Remove track from playlist
      responses:
        '204':
          description: Track removed from playlist
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PlaylistId:
      name: playlistId
      in: path
      required: true
      description: Playlist identifier
      schema:
        type: string
        minLength: 1

    TrackId:
      name: trackId
      in: path
      required: true
      description: Track identifier
      schema:
        type: string
        minLength: 1

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    RegisterResponse:
      type: object
      required:
        - verification_id
        - expires_in
      properties:
        verification_id:
          type: string
          format: uuid
        expires_in:
          type: integer
          format: int32
          minimum: 1

    VerifyRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - verification_id
        - code
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'

    ResendRegistrationVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - verification_id
      properties:
        verification_id:
          type: string
          format: uuid

    RegistrationVerificationResponse:
      type: object
      required:
        - verification_id
        - expires_in
        - retry_after
      properties:
        verification_id:
          type: string
          format: uuid
        expires_in:
          type: integer
          format: int32
          minimum: 1
        retry_after:
          type: integer
          format: int32
          minimum: 0

    UserResponse:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    Track:
      type: object
      required:
        - id
        - title
        - artist
        - url
        - albumTitle
        - albumArtURL
        - previewURL
        - genre
        - year
      properties:
        id:
          type: string
          example: "track-001"

        title:
          type: string
          minLength: 1
          maxLength: 300
          example: "Song Title"

        artist:
          type: string
          minLength: 1
          maxLength: 300
          example: "Artist"

        url:
          type: string
          format: uri
          example: "https://example.com/song.mp3"

        albumTitle:
          type: string
          example: "Album"

        albumArtURL:
          type: string
          format: uri
          example: "https://example.com/album.jpg"

        previewURL:
          type: string
          format: uri
          example: "https://example.com/preview.mp3"

        genre:
          type: array
          items:
            type: string
          example:
            - Rock
            - Alternative

        year:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2025

    CreateTrackRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - artist
        - url
        - albumTitle
        - albumArtURL
        - previewURL
        - genre
        - year
      properties:
        id:
          type: string
          minLength: 1
          example: "track-001"

        title:
          type: string
          minLength: 1
          maxLength: 300

        artist:
          type: string
          minLength: 1
          maxLength: 300

        url:
          type: string
          format: uri

        albumTitle:
          type: string

        albumArtURL:
          type: string
          format: uri

        previewURL:
          type: string
          format: uri

        genre:
          type: array
          items:
            type: string

        year:
          type: integer
          minimum: 1900
          maximum: 2100

    UpdateTrackRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - artist
        - url
        - albumTitle
        - albumArtURL
        - previewURL
        - genre
        - year
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300

        artist:
          type: string
          minLength: 1
          maxLength: 300

        url:
          type: string
          format: uri

        albumTitle:
          type: string

        albumArtURL:
          type: string
          format: uri

        previewURL:
          type: string
          format: uri

        genre:
          type: array
          items:
            type: string

        year:
          type: integer
          minimum: 1900
          maximum: 2100

    TrackResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Track'

    TrackListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Track'

    Playlist:
      type: object
      required:
        - id
        - name
        - tracks
      properties:
        id:
          type: string
          description: Playlist identifier
          example: "66c8b7e2b0e9c6a8c9a2d123"

        name:
          type: string
          description: Playlist name
          minLength: 1
          maxLength: 200
          example: "My Workout"

        tracks:
          type: array
          description: Track identifiers contained in the playlist
          items:
            type: string
          example:
            - "track-001"
            - "track-002"

    CreatePlaylistRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "My Workout"

    UpdatePlaylistRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Updated Workout"

    PlaylistResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Playlist'

    MessageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: "track added to playlist"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - INVALID_PLAYLIST
                - INVALID_PLAYLIST_ID
                - INVALID_PLAYLIST_NAME
                - PLAYLIST_NOT_FOUND
                - TRACK_NOT_FOUND
                - PLAYLIST_ALREADY_EXISTS
                - INTERNAL_ERROR
                - INVALID_TRACK
                - INVALID_TRACK_ID
                - INVALID_TRACK_TITLE
                - INVALID_TRACK_ARTIST
                - INVALID_TRACK_URL
                - INVALID_TRACK_YEAR
                - TRACK_ALREADY_EXISTS
                - USER_ALREADY_EXISTS
                - VERIFICATION_INVALID
                - VERIFICATION_EXPIRED
                - VERIFICATION_TOO_MANY_ATTEMPTS
                - VERIFICATION_RATE_LIMITED
                - UNAUTHORIZED
              example: PLAYLIST_NOT_FOUND

            message:
              type: string
              example: playlist not found

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          description: Number of seconds after which the client may retry the request.
          schema:
            type: integer
            format: int32
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
