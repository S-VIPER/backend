name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: ["main", "master" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.0'
          cache: true
      
      - name: Install dependencies
        run: |
          cd gin-api
          go mod download

      - name: Generate OpenAPI
        working-directory: gin-api
        run: go generate ./...
      
      - name: Check generated code
        working-directory: gin-api
        run: git diff --exit-code
      
      - name: Run tests
        run: |
          cd gin-api
          go test -v -cover ./...


  build:
    name: Build Docker Images for Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        run: |
          docker build -t sviper-backend:test -f gin-api/Dockerfile gin-api

      - name: Build seeder image
        run: |
          docker build -t sviper-seeder:test -f gin-api/Dockerfile.seeder gin-api
