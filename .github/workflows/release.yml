name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          cd gin-api
          go mod download

      - name: Run tests
        run: |
          cd gin-api
          go test -v ./...

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define backend image names (lowercase owner)
        run: |
          # Сделаем owner в lowercase (без зависимости от toLower())
          OWNER_LOWER=$(printf "%s" "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          VERSION_TAG=v${{ github.run_number }}
          IMAGE_REPO_BACKEND="ghcr.io/${OWNER_LOWER}/backend"
          IMAGE_TAGS_BACKEND="${IMAGE_REPO_BACKEND}:${VERSION_TAG},${IMAGE_REPO_BACKEND}:latest"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "IMAGE_REPO_BACKEND=$IMAGE_REPO_BACKEND" >> $GITHUB_ENV
          echo "IMAGE_TAGS_BACKEND=$IMAGE_TAGS_BACKEND" >> $GITHUB_ENV

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_REPO_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_TAGS_BACKEND }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create backend images file
        run: |
          echo "Backend images:" > backend-images.txt
          IFS=',' read -ra TAGS <<< "${IMAGE_TAGS_BACKEND}"
          for t in "${TAGS[@]}"; do
            echo "- $t" >> backend-images.txt
          done
        env:
          IMAGE_TAGS_BACKEND: ${{ env.IMAGE_TAGS_BACKEND }}

      - name: Upload backend images artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-images
          path: backend-images.txt

  build-seeder:
    name: Build & Push Seeder
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define seeder image names (lowercase owner)
        run: |
          OWNER_LOWER=$(printf "%s" "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          VERSION_TAG=v${{ github.run_number }}
          IMAGE_REPO_SEEDER="ghcr.io/${OWNER_LOWER}/seeder"
          IMAGE_TAGS_SEEDER="${IMAGE_REPO_SEEDER}:${VERSION_TAG},${IMAGE_REPO_SEEDER}:latest"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "IMAGE_REPO_SEEDER=$IMAGE_REPO_SEEDER" >> $GITHUB_ENV
          echo "IMAGE_TAGS_SEEDER=$IMAGE_TAGS_SEEDER" >> $GITHUB_ENV

      - name: Extract seeder metadata
        id: meta-seeder
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_REPO_SEEDER }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push seeder image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile.seeder
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_TAGS_SEEDER }}
          labels: ${{ steps.meta-seeder.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create seeder images file
        run: |
          echo "Seeder images:" > seeder-images.txt
          IFS=',' read -ra TAGS <<< "${IMAGE_TAGS_SEEDER}"
          for t in "${TAGS[@]}"; do
            echo "- $t" >> seeder-images.txt
          done
        env:
          IMAGE_TAGS_SEEDER: ${{ env.IMAGE_TAGS_SEEDER }}

      - name: Upload seeder images artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeder-images
          path: seeder-images.txt

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-backend, build-seeder]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend images artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-images
          path: .

      - name: Download seeder images artifact
        uses: actions/download-artifact@v4
        with:
          name: seeder-images
          path: .

      - name: Build release body (release_body.md)
        run: |
          echo "# Release v${{ github.run_number }}" > release_body.md
          echo "" >> release_body.md
          echo "This release contains the following Docker images published to GHCR:" >> release_body.md
          echo "" >> release_body.md
          if [ -f backend-images.txt ]; then
            echo "## Backend" >> release_body.md
            cat backend-images.txt >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -f seeder-images.txt ]; then
            echo "## Seeder" >> release_body.md
            cat seeder-images.txt >> release_body.md
            echo "" >> release_body.md
          fi
          echo "Release created by CI workflow." >> release_body.md

      - name: Create Release (and attach image files)
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body_path: release_body.md
          files: |
            backend-images.txt
            seeder-images.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show release info
        run: |
          echo "Release created. Action outputs:"
          echo "id: ${{ steps.create_release.outputs.id }}"
          echo "url: ${{ steps.create_release.outputs.url || 'n/a' }}"
          echo "upload_url: ${{ steps.create_release.outputs.upload_url || 'n/a' }}"
