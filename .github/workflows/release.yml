name: Release

on:
  push:
    branches:
      - release

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: |
          cd gin-api
          go test -v ./...

      - name: Build Docker image
        run: |
          docker build -t sviper-dj-backend:${{ github.sha }} -f gin-api/Dockerfile .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MARK_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag sviper-dj-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/sviper-dj-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/sviper-dj-backend:${{ github.sha }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 