name: Release

on:
  push:
    branches:
      - release

jobs:
  test-and-build:
    name: Run Tests, Build and push -- backend & seeder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: |
          cd gin-api
          go test -v ./...

      - name: Build backend Docker image
        run: |
          docker build -t sviper-dj-backend:latest -f gin-api/Dockerfile gin-api

      - name: Build seeder Docker image
        run: |
          docker build -t sviper-dj-seeder:latest -f gin-api/Dockerfile.seeder gin-api

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MARK_TOKEN }}

      - name: Push backend Docker image
        run: |
          docker tag sviper-dj-backend:latest ghcr.io/sviper/sviper-dj-backend:latest
          docker push ghcr.io/sviper/sviper-dj-backend:latest

      - name: Push seeder Docker image
        run: |
          docker tag sviper-dj-seeder:latest ghcr.io/sviper/sviper-dj-seeder:latest
          docker push ghcr.io/sviper/sviper-dj-seeder:latest

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
