name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write 

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          cd gin-api
          go mod download

      - name: Run tests
        run: |
          cd gin-api
          go test -v ./...

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set OWNER (lowercase)
        run: |
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/sviper-dj-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-seeder:
    name: Build & Push Seeder
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set OWNER (lowercase)
        run: |
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push seeder image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile.seeder
          push: true
          tags: ghcr.io/${{ env.OWNER }}/sviper-dj-seeder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-seeder]

    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
