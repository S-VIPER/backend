name: Release

on:
  push:
    branches:
      - release

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          cd gin-api
          go mod download

      - name: Run tests
        run: |
          cd gin-api
          go test -v ./...

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags:  ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-seeder:
    name: Build & Push Seeder
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract seeder metadata
        id: meta-seeder
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/seeder
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push seeder image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile.seeder
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-seeder.outputs.tags }}
          labels: ${{ steps.meta-seeder.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-seeder]

    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
