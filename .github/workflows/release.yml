name: Release

on:
  push:
    branches: [ "release" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          cd gin-api
          go mod download

      - name: Run tests
        run: |
          cd gin-api
          go test -v ./...

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MARK_TOKEN }}

      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile
          push: false
          tags: sviper-dj-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build seeder Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./gin-api
          file: ./gin-api/Dockerfile.seeder
          push: false
          tags: sviper-dj-seeder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push backend Docker image
        run: |
          docker tag sviper-dj-backend:latest ghcr.io/${{ github.repository_owner.toLowerCase() }}/sviper-dj-backend:latest
          docker push ghcr.io/${{ github.repository_owner.toLowerCase() }}/sviper-dj-backend:latest

      - name: Push seeder Docker image
        run: |
          docker tag sviper-dj-seeder:latest ghcr.io/${{ github.repository_owner.toLowerCase() }}/sviper-dj-seeder:latest
          docker push ghcr.io/${{ github.repository_owner.toLowerCase() }}/sviper-dj-seeder:latest

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
